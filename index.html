<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>咖啡禮盒扭蛋抽獎</title>
  <style>
    :root {
      --coffee-1: #F29F05;
      --coffee-2: #A67458;
      --coffee-3: #730202;
      --coffee-4: #BF0F0F;
      --coffee-5: #F29999;
      --bg: #fff7ef;
      --text: #3c2419;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 10%, rgba(242,159,5,.3), transparent 35%),
        radial-gradient(circle at 85% 20%, rgba(242,153,153,.3), transparent 40%),
        linear-gradient(160deg, #fff8f0, #ffe6d0 60%, #ffd6d6);
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .layout {
      width: min(980px, 100%);
      background: var(--bg);
      border: 2px solid rgba(166,116,88,.35);
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(115, 2, 2, .2);
      overflow: hidden;
    }

    .banner {
      background: linear-gradient(135deg, var(--coffee-4), var(--coffee-3));
      color: #fff;
      text-align: center;
      padding: 18px 14px;
    }

    .banner h1 {
      margin: 0;
      font-size: clamp(1.4rem, 4vw, 2.1rem);
      letter-spacing: 1px;
    }

    .banner p {
      margin: 8px 0 0;
      opacity: .92;
    }

    .content {
      display: grid;
      grid-template-columns: 1.25fr .75fr;
      gap: 18px;
      padding: 20px;
    }

    @media (max-width: 820px) {
      .content { grid-template-columns: 1fr; }
    }

    .machine-wrap {
      border-radius: 24px;
      border: 2px dashed rgba(166,116,88,.5);
      background: linear-gradient(180deg, #fff, #fff1e7);
      padding: 18px;
      display: grid;
      place-items: center;
    }

    .machine {
      width: min(420px, 100%);
      display: grid;
      justify-items: center;
      gap: 10px;
    }

    .top {
      width: 92%;
      height: 50px;
      border-radius: 20px 20px 10px 10px;
      background: linear-gradient(135deg, var(--coffee-1), #f7c74e);
      border: 3px solid var(--coffee-2);
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 800;
      letter-spacing: 1px;
      text-shadow: 0 2px 4px rgba(0,0,0,.15);
    }

    .glass {
      width: 260px;
      height: 260px;
      border-radius: 50%;
      border: 8px solid var(--coffee-2);
      background:
        radial-gradient(circle at 30% 20%, rgba(255,255,255,.9), rgba(255,255,255,.15) 45%, rgba(242,159,5,.18) 100%),
        linear-gradient(150deg, rgba(166,116,88,.2), rgba(242,153,153,.2));
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
    }

    .beans {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 20% 70%, #A67458 0 8px, transparent 9px),
        radial-gradient(circle at 70% 30%, #F29F05 0 7px, transparent 8px),
        radial-gradient(circle at 62% 75%, #BF0F0F 0 7px, transparent 8px),
        radial-gradient(circle at 42% 42%, #730202 0 9px, transparent 10px),
        radial-gradient(circle at 78% 58%, #F29999 0 8px, transparent 9px);
      opacity: .55;
    }

    .capsule {
      width: 122px;
      height: 122px;
      border-radius: 50%;
      background: linear-gradient(130deg, var(--coffee-4), var(--coffee-1));
      color: #fff;
      border: 4px solid #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 1.1rem;
      box-shadow: 0 10px 20px rgba(0,0,0,.25);
      z-index: 1;
    }

    .capsule.roll { animation: spin .9s ease; }

    @keyframes spin {
      0% { transform: rotate(0) translateY(0); }
      30% { transform: rotate(140deg) translateY(-6px); }
      60% { transform: rotate(280deg) translateY(4px); }
      100% { transform: rotate(360deg) translateY(0); }
    }

    .body {
      width: 240px;
      border-radius: 18px;
      background: linear-gradient(180deg, #fff, #fde5d6);
      border: 5px solid var(--coffee-2);
      padding: 14px;
      display: grid;
      justify-items: center;
      gap: 14px;
      position: relative;
    }

    .handle {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      border: 0;
      font-size: 1.8rem;
      cursor: pointer;
      color: #fff;
      background: radial-gradient(circle at 35% 25%, #ffc96c, var(--coffee-1) 38%, var(--coffee-4) 100%);
      box-shadow: inset 0 4px 8px rgba(255,255,255,.4), 0 7px 12px rgba(115,2,2,.35);
      transition: transform .2s ease;
    }

    .handle:hover { transform: scale(1.04); }
    .handle:disabled { opacity: .5; cursor: not-allowed; }

    .slot {
      width: 120px;
      height: 24px;
      border-radius: 999px;
      background: #4a2d20;
      border: 3px solid #8b5d46;
    }

    .chute {
      width: 140px;
      min-height: 72px;
      border-radius: 14px;
      background: linear-gradient(180deg, #402419, #22130d);
      border: 3px solid #8b5d46;
      display: grid;
      place-items: center;
      color: #ffd8ad;
      text-align: center;
      padding: 8px;
      font-weight: 700;
    }

    .panel {
      border-radius: 20px;
      border: 1px solid rgba(166,116,88,.35);
      background: #fff;
      padding: 16px;
      display: grid;
      gap: 12px;
      align-content: start;
    }

    .tag {
      display: inline-block;
      border-radius: 999px;
      background: rgba(242,159,5,.18);
      color: #8a4f27;
      padding: 5px 10px;
      font-size: .9rem;
      font-weight: 700;
      width: fit-content;
    }

    .msrp {
      border-radius: 14px;
      background: linear-gradient(140deg, #fff8ef, #ffe8dd);
      border: 1px solid #f3cdb5;
      padding: 12px;
    }

    .msrp b { font-size: 1.5rem; color: var(--coffee-3); }

    .result {
      min-height: 110px;
      border-radius: 14px;
      border: 1px solid rgba(191,15,15,.35);
      background: linear-gradient(150deg, rgba(242,159,5,.12), rgba(242,153,153,.16));
      padding: 12px;
      display: grid;
      align-content: center;
    }

    .cta {
      border: 0;
      border-radius: 12px;
      padding: 12px;
      font-size: 1rem;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, var(--coffee-1), var(--coffee-4));
    }

    .help {
      margin: 0;
      font-size: .92rem;
      color: #6c4b3d;
    }
  </style>
</head>
<body>
  <main class="layout">
    <header class="banner">
      <h1>☕ 咖啡市集｜禮盒扭蛋抽獎</h1>
      <p>今天的咖啡禮盒優惠價，交給扭蛋機決定！</p>
    </header>

    <section class="content">
      <div class="machine-wrap">
        <div class="machine">
          <div class="top">COFFEE GACHA</div>
          <div class="glass">
            <div class="beans"></div>
            <div class="capsule" id="capsule">READY</div>
          </div>

          <div class="body">
            <button class="handle" id="drawBtn" aria-label="轉扭蛋">⟳</button>
            <div class="slot" aria-hidden="true"></div>
            <div class="chute" id="chute">等待掉出扭蛋...</div>
          </div>
        </div>
      </div>

      <aside class="panel">
        <span class="tag">限時活動</span>
        <h2 style="margin:0;color:#730202;">咖啡禮盒抽獎價</h2>

        <div class="msrp">
          <div>原價</div>
          <b>NT$520</b>
        </div>

        <div class="result" id="result">
          尚未抽獎。點擊扭蛋旋鈕後，才會揭曉你的抽獎價。
        </div>

        <button class="cta" id="resetBtn" type="button">重置再抽</button>
        <p class="help">抽獎價只會在抽中後顯示（450 或 350）。</p>
        <p class="help">目前示範機率：450 = 70%、350 = 30%（可再調整）。</p>
      </aside>
    </section>
  </main>

  <script>
    const PROBABILITY = {
      450: 0.7,
      350: 0.3,
    };

    const drawBtn = document.getElementById('drawBtn');
    const resetBtn = document.getElementById('resetBtn');
    const result = document.getElementById('result');
    const capsule = document.getElementById('capsule');
    const chute = document.getElementById('chute');

    function drawPrice() {
      const random = Math.random();
      if (random < PROBABILITY[450]) return 450;
      return 350;
    }

    drawBtn.addEventListener('click', () => {
      drawBtn.disabled = true;
      capsule.classList.remove('roll');
      void capsule.offsetWidth;
      capsule.classList.add('roll');

      capsule.textContent = '...';
      chute.textContent = '扭蛋轉動中';
      result.textContent = '正在抽出你的優惠價，請稍候...';

      setTimeout(() => {
        const price = drawPrice();
        capsule.textContent = `NT$${price}`;
        chute.innerHTML = `🎁 抽中 NT$${price}`;
        result.innerHTML = `恭喜！你抽到 <strong>NT$${price}</strong> 的咖啡禮盒優惠價。`;
      }, 900);
    });

    resetBtn.addEventListener('click', () => {
      drawBtn.disabled = false;
      capsule.textContent = 'READY';
      chute.textContent = '等待掉出扭蛋...';
      result.textContent = '已重置。點擊扭蛋旋鈕後，才會揭曉抽獎價。';
    });
  </script>
</body>
</html>
